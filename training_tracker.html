// PWA: generate icon + manifest + service worker so browser offers "Add to Home Screen"
window.addEventListener('DOMContentLoaded', async function() {
  // --- Generate app icon via canvas ---
  function makeIcon(size) {
    try {
      var c = document.createElement('canvas');
      c.width = size; c.height = size;
      var ctx = c.getContext('2d');
      var r = size * 0.18;
      // Dark background with rounded corners
      ctx.fillStyle = '#020617';
      ctx.beginPath();
      ctx.moveTo(r,0); ctx.lineTo(size-r,0);
      ctx.arc(size-r,r,r,-Math.PI/2,0);
      ctx.lineTo(size,size-r);
      ctx.arc(size-r,size-r,r,0,Math.PI/2);
      ctx.lineTo(r,size);
      ctx.arc(r,size-r,r,Math.PI/2,Math.PI);
      ctx.lineTo(0,r);
      ctx.arc(r,r,r,Math.PI,Math.PI*3/2);
      ctx.closePath();
      ctx.fill();
      // Amber dumbbell
      var s = size * 0.12;
      ctx.fillStyle = '#f59e0b';
      // Left plate
      ctx.fillRect(size*0.08, size*0.32, s, size*0.36);
      // Bar
      ctx.fillRect(size*0.08+s, size*0.44, size*0.68-s*2, size*0.12);
      // Right plate
      ctx.fillRect(size*0.08+size*0.68-s, size*0.32, s, size*0.36);
      return c.toDataURL('image/png');
    } catch(e) { return ''; }
  }

  var icon192 = makeIcon(192);
  var icon512 = makeIcon(512);

  // --- Inject manifest ---
  try {
    var manifest = {
      name: '12 Week Training Tracker',
      short_name: 'Training',
      description: 'Daily workout tracker for your 12-week plan',
      start_url: './',
      scope: './',
      display: 'standalone',
      background_color: '#020617',
      theme_color: '#f59e0b',
      orientation: 'portrait-primary',
      icons: [
        { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
        { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
      ]
    };
    var mBlob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
    var mUrl = URL.createObjectURL(mBlob);
    var link = document.createElement('link');
    link.rel = 'manifest'; link.href = mUrl;
    document.head.appendChild(link);
  } catch(e) {}

  // --- Register service worker (enables install prompt on Android) ---
  if ('serviceWorker' in navigator) {
    var swCode = [
      "self.addEventListener('install', function(e){ self.skipWaiting(); });",
      "self.addEventListener('activate', function(e){ e.waitUntil(clients.claim()); });",
      "self.addEventListener('fetch', function(e){",
      "  e.respondWith(fetch(e.request).catch(function(){",
      "    return caches.match(e.request).then(function(r){ return r || new Response(''); });",
      "  }));",
      "});"
    ].join('\n');
    try {
      var swBlob = new Blob([swCode], {type:'text/javascript'});
      var swUrl = URL.createObjectURL(swBlob);
      await navigator.serviceWorker.register(swUrl, {scope: './'});
    } catch(e) {}
  }

  // --- Show custom install banner if browser supports it ---
  var installPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    installPrompt = e;
    // Show a small install nudge
    var banner = document.createElement('div');
    banner.id = 'install-banner';
    banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999;background:#f59e0b;color:#020617;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;font-family:system-ui,sans-serif;font-size:14px;font-weight:700;max-width:480px;margin:0 auto;';
    banner.innerHTML = '<span>📲 Add Training Tracker to your home screen</span><button id="install-btn" style="background:#020617;color:#f59e0b;border:none;padding:6px 14px;border-radius:8px;font-weight:800;font-size:13px;cursor:pointer;">Install</button>';
    document.body.prepend(banner);
    document.getElementById('install-btn').addEventListener('click', async function() {
      if (installPrompt) {
        await installPrompt.prompt();
        installPrompt = null;
        banner.remove();
      }
    });
  });
  window.addEventListener('appinstalled', function() {
    var b = document.getElementById('install-banner');
    if (b) b.remove();
  });
});
</script>

const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// ─────────────────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────────────────
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const parseYMD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const c = new Date(d); c.setDate(c.getDate()+n); return c; };
const dayName = d => DAYS[d.getDay()];
const sameDay = (a, b) => ymd(a) === ymd(b);
const fmtNice = d => `${DAYS[d.getDay()].slice(0,3)}, ${MONTHS[d.getMonth()]} ${d.getDate()}`;
const weekNum = (date, startStr) => Math.floor((date - parseYMD(startStr)) / 86400000 / 7) + 1;
const uid = () => 'x' + Date.now() + Math.floor(Math.random()*9999);

const buildLog = date => {
  const sched = SCHEDULE[dayName(date)];
  const sections = {};
  sched.sections.forEach(sec => {
    sections[sec.name] = {
      done: '',
      exercises: sec.exercises.map((e, i) => ({
        id: 's' + i, ex: e.ex, sets: e.sets, reps: e.reps,
        done: '', weight: '',
      })),
    };
  });
  return { status: 'Not Started', energy: null, painS: null, painB: null, painK: null, notes: '', sections };
};

const normalizeLog = (date, stored) => {
  if (!stored) return buildLog(date);
  const sched = SCHEDULE[dayName(date)];
  const fresh = buildLog(date);
  const log = Object.assign({}, fresh, stored);
  if (!log.sections || typeof log.sections !== 'object') return fresh;
  sched.sections.forEach(sec => {
    const stSec = log.sections[sec.name];
    if (!stSec || !Array.isArray(stSec.exercises) || stSec.exercises.length === 0
        || typeof stSec.exercises[0] !== 'object' || !stSec.exercises[0].ex) {
      const oldEx = (stSec && stSec.exercises) || {};
      log.sections[sec.name] = {
        done: (stSec && stSec.done) || '',
        exercises: sec.exercises.map((e, i) => ({
          id: 's' + i, ex: e.ex, sets: e.sets, reps: e.reps,
          done: (oldEx[i] && oldEx[i].done) || '',
          weight: (oldEx[i] && oldEx[i].weight) || '',
        })),
      };
    }
  });
  return log;
};

// ─────────────────────────────────────────────────────
//  STORAGE WRAPPER
//  Uses window.storage if available, falls back to localStorage
// ─────────────────────────────────────────────────────
const useStorage = (typeof window.storage !== 'undefined' && window.storage);
const storage = {
  async get(key) {
    if (useStorage) {
      try { const r = await window.storage.get(key); return r && r.value ? r.value : null; } catch { return null; }
    } else {
      try { return localStorage.getItem(key); } catch { return null; }
    }
  },
  async set(key, value) {
    if (useStorage) {
      try { await window.storage.set(key, value); return true; } catch { return false; }
    } else {
      try { localStorage.setItem(key, value); return true; } catch { return false; }
    }
  },
  async delete(key) {
    if (useStorage) {
      try { await window.storage.delete(key); return true; } catch { return false; }
    } else {
      try { localStorage.removeItem(key); return true; } catch { return false; }
    }
  },
  async list(prefix) {
    if (useStorage) {
      try { const r = await window.storage.list(prefix); return (r && r.keys) || []; } catch { return []; }
    } else {
      const keys = [];
      try { for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(prefix)) keys.push(k);
      } } catch {}
      return keys;
    }
  },
};

const logKey = d => 'log:' + ymd(d);
const loadLog = async d => {
  const v = await storage.get(logKey(d));
  if (!v) return null;
  try { return JSON.parse(v); } catch { return null; }
};
const saveLog = async (d, log) => storage.set(logKey(d), JSON.stringify(log));

// ─────────────────────────────────────────────────────
//  APP ROOT
// ─────────────────────────────────────────────────────
function App() {
  const [view, setView] = useState('today');
  const [curDate, setCurDate] = useState(() => new Date(new Date().setHours(0,0,0,0)));
  const [dayLog, setDayLog] = useState(null);
  const [startDate, setStartDate] = useState('2026-06-08');
  const [loading, setLoading] = useState(true);
  const [saveStatus, setSaveStatus] = useState('idle');
  const [celebrate, setCelebrate] = useState(false);
  const skipSave = useRef(true);
  const prevComplete = useRef(false);

  useEffect(() => {
    (async () => {
      const settingsRaw = await storage.get('settings');
      if (settingsRaw) {
        try { const s = JSON.parse(settingsRaw); if (s.startDate) setStartDate(s.startDate); } catch {}
      }
      const stored = await loadLog(curDate);
      setDayLog(normalizeLog(curDate, stored));
      setLoading(false);
    })();
  }, []);

  useEffect(() => {
    if (loading) return;
    skipSave.current = true;
    prevComplete.current = false;
    (async () => {
      const stored = await loadLog(curDate);
      setDayLog(normalizeLog(curDate, stored));
    })();
  }, [curDate]);

  useEffect(() => {
    if (!dayLog || loading) return;
    if (skipSave.current) { skipSave.current = false; return; }
    setSaveStatus('saving');
    const t = setTimeout(async () => {
      const ok = await saveLog(curDate, dayLog);
      setSaveStatus(ok ? 'saved' : 'idle');
      if (ok) setTimeout(() => setSaveStatus(s => s === 'saved' ? 'idle' : s), 1800);
    }, 350);
    return () => clearTimeout(t);
  }, [dayLog]);

  useEffect(() => {
    if (!dayLog) return;
    const all = Object.values(dayLog.sections).flatMap(s => s.exercises);
    const done = all.length > 0 && all.every(e => e.done === 'Yes');
    if (done && !prevComplete.current) {
      prevComplete.current = true;
      setCelebrate(true);
      setTimeout(() => setCelebrate(false), 2500);
    }
    if (!done) prevComplete.current = false;
  }, [dayLog]);

  const patchLog = patch => setDayLog(p => Object.assign({}, p, patch));
  const patchSec = (sec, patch) => setDayLog(p => {
    const next = JSON.parse(JSON.stringify(p));
    next.sections[sec] = Object.assign({}, next.sections[sec], patch);
    return next;
  });
  const patchEx = (sec, id, patch) => setDayLog(p => {
    const next = JSON.parse(JSON.stringify(p));
    const idx = next.sections[sec].exercises.findIndex(e => e.id === id);
    if (idx >= 0) next.sections[sec].exercises[idx] = Object.assign({}, next.sections[sec].exercises[idx], patch);
    return next;
  });
  const addEx = (sec, ex) => setDayLog(p => {
    const next = JSON.parse(JSON.stringify(p));
    next.sections[sec].exercises.push(Object.assign({ id: uid(), done: '', weight: '' }, ex));
    return next;
  });
  const deleteEx = (sec, id) => setDayLog(p => {
    const next = JSON.parse(JSON.stringify(p));
    next.sections[sec].exercises = next.sections[sec].exercises.filter(e => e.id !== id);
    return next;
  });

  if (loading || !dayLog) {
    return <div style={{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', color:'#94a3b8'}} className="mono">Loading…</div>;
  }

  return (
    <>
      {saveStatus !== 'idle' && (
        <div className={'save-pill ' + (saveStatus === 'saving' ? 'save-saving' : 'save-saved')}>
          {saveStatus === 'saving'
            ? <><div className="spinner"/>Saving</>
            : <><Icon name="check" size={12} strokeWidth={3} color="#fff"/>Saved</>
          }
        </div>
      )}

      {celebrate && (
        <div className="celebrate">
          <div className="celebrate-card pulse">
            <Icon name="sparkles" size={22} color="#0f172a"/>
            Day Complete!
          </div>
        </div>
      )}

      {view === 'today' && <TodayView
        curDate={curDate} setCurDate={setCurDate} dayLog={dayLog}
        patchLog={patchLog} patchSec={patchSec} patchEx={patchEx}
        addEx={addEx} deleteEx={deleteEx} startDate={startDate} />}
      {view === 'stats' && <StatsView startDate={startDate}/>}
      {view === 'settings' && <SettingsView startDate={startDate} setStartDate={async d => {
        setStartDate(d);
        await storage.set('settings', JSON.stringify({startDate:d}));
      }}/>}

      <div className="nav">
        <div className="nav-inner">
          {[
            {id:'today', icon:'home', label:'Today'},
            {id:'stats', icon:'bars', label:'Stats'},
            {id:'settings', icon:'settings', label:'Settings'},
          ].map(t => (
            <button key={t.id} onClick={() => setView(t.id)} className={'nav-btn ' + (view === t.id ? 'active' : '')}>
              <Icon name={t.icon} size={22} strokeWidth={view === t.id ? 2.5 : 2}/>
              <span className="nav-btn-label">{t.label}</span>
            </button>
          ))}
        </div>
      </div>
    </>
  );
}

// ─────────────────────────────────────────────────────
//  TODAY VIEW
// ─────────────────────────────────────────────────────
function TodayView({ curDate, setCurDate, dayLog, patchLog, patchSec, patchEx, addEx, deleteEx, startDate }) {
  const today = new Date(new Date().setHours(0,0,0,0));
  const isToday = sameDay(curDate, today);
  const wk = weekNum(curDate, startDate);
  const sched = SCHEDULE[dayName(curDate)];

  const { totalEx, doneEx } = useMemo(() => {
    let t=0, d=0;
    Object.values(dayLog.sections).forEach(s => s.exercises.forEach(e => { t++; if (e.done === 'Yes') d++; }));
    return { totalEx: t, doneEx: d };
  }, [dayLog]);
  const pct = totalEx > 0 ? doneEx / totalEx : 0;
  const circ = 2 * Math.PI * 26;

  return (
    <div>
      <div className="px-4 pt-5 pb-2">
        <div className="row" style={{justifyContent:'space-between'}}>
          <button onClick={() => setCurDate(addDays(curDate,-1))} style={{padding:8, borderRadius:'50%'}}>
            <Icon name="chevronLeft" size={26}/>
          </button>
          <div className="text-center">
            <div style={{fontSize:11, fontWeight:800, letterSpacing:'0.22em', textTransform:'uppercase', color: isToday ? '#fbbf24' : '#94a3b8'}}>
              {isToday ? 'Today' : <span onClick={() => setCurDate(today)} style={{cursor:'pointer'}}>← Today</span>}
            </div>
            <div className="h1 mt-1">{fmtNice(curDate)}</div>
            {wk >= 1 && wk <= 12 &&
              <div className="meta mono mt-1">Week {wk} of 12</div>
            }
          </div>
          <button onClick={() => setCurDate(addDays(curDate,1))} style={{padding:8, borderRadius:'50%'}}>
            <Icon name="chevronRight" size={26}/>
          </button>
        </div>

        <div className="focus-card mt-4">
          <div className="ring-wrap">
            <svg viewBox="0 0 64 64">
              <circle cx="32" cy="32" r="26" stroke="rgba(255,255,255,0.1)" strokeWidth="6" fill="none"/>
              <circle cx="32" cy="32" r="26" stroke="#f59e0b" strokeWidth="6" fill="none"
                strokeDasharray={(pct*circ) + ' ' + circ} strokeLinecap="round"/>
            </svg>
            <div className="ring-text">{Math.round(pct*100)}%</div>
          </div>
          <div className="grow">
            <div style={{fontSize:10, fontWeight:800, letterSpacing:'0.16em', textTransform:'uppercase', color:'#fbbf24'}}>Focus</div>
            <div className="h2 mt-1">{sched.focus}</div>
            <div className="meta mono mt-1">{doneEx}/{totalEx} exercises</div>
          </div>
        </div>
      </div>

      <DayLog dayLog={dayLog} patchLog={patchLog}/>

      <div className="px-4 mt-3 space-y-3">
        {sched.sections.map((sec, i) => (
          <SectionCard key={sec.name}
            secName={sec.name}
            log={dayLog.sections[sec.name] || {done:'', exercises:[]}}
            patchSec={p => patchSec(sec.name, p)}
            patchEx={(id, p) => patchEx(sec.name, id, p)}
            addEx={ex => addEx(sec.name, ex)}
            deleteEx={id => deleteEx(sec.name, id)}
            defaultOpen={i === 0}
          />
        ))}
      </div>
    </div>
  );
}

  }[s]);

  return (
    <div className="px-4 mt-3">

            </div>

            {[['painS','Shoulder Pain'],['painB','Back Pain'],['painK','Knee Pain']].map(([k,l]) => (
              <div key={k}>
                <div className="label">{l} <span style={{color:'#94a3b8'}}>0-10</span></div>
                <NumPad value={dayLog[k]} min={0} max={10} onChange={v => patchLog({[k]:v})}
                  colorFn={v => v <= 2 ? '#10b981' : v <= 5 ? '#f59e0b' : '#ef4444'}/>
              </div>
            ))}

            <div>
              <div className="label">Notes</div>
              <textarea value={dayLog.notes || ''} onChange={e => patchLog({notes:e.target.value})}
                placeholder="How did it feel today?" rows={2}
                className="input mt-2" style={{resize:'none'}}/>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function NumPad({ value, min, max, onChange, colorFn }) {
  return (
    <div className="numpad">
      {Array.from({length: max-min+1}, (_, i) => {
        const v = min + i;
        const sel = value === v;
        const col = sel && colorFn ? colorFn(v) : null;
        const style = sel && col ? { background: col, color: col === '#f59e0b' ? '#0f172a' : '#fff' } : {};
        return (
          <button key={v} onClick={() => onChange(sel ? null : v)}
            className={'num-btn' + (sel ? ' selected' : '')}
            style={style}>{v}</button>
        );
      })}
    </div>
  );
}

// ─────────────────────────────────────────────────────
//  SECTION CARD
// ─────────────────────────────────────────────────────
function SectionCard({ secName, log, patchSec, patchEx, addEx, deleteEx, defaultOpen }) {
  const [open, setOpen] = useState(defaultOpen);
  const [adding, setAdding] = useState(false);
  const color = SEC_COLOR[secName] || '#94a3b8';

  const total = log.exercises.length;
  const done = log.exercises.filter(e => e.done === 'Yes').length;
  const allDone = total > 0 && done === total;

  const bgColor = color + '22'; // ~13% opacity hex

  return (
    <div className="sec-card" style={{borderColor: allDone ? color : '#334155', background: bgColor}}>
      <button onClick={() => setOpen(o => !o)} className="sec-header">
        <div className="sec-bar" style={{background: color}}/>
        <div className="grow">
          <div className="sec-title" style={{color}}>{secName}</div>
          <div className="sec-meta">{done}/{total} done</div>
        </div>
        {allDone && <Icon name="check" size={18} strokeWidth={3} color={color}/>}
        <Icon name="chevronDown" size={18} color="#cbd5e1"/>
      </button>

      {open && (
        <div className="sec-body">
          {log.exercises.map(ex => (
            <ExRow key={ex.id} ex={ex}
              update={p => patchEx(ex.id, p)}
              remove={() => deleteEx(ex.id)}
              tintColor={color}/>
          ))}

          {adding
            ? <AddForm tintColor={color} onSave={ex => { addEx(ex); setAdding(false); }} onCancel={() => setAdding(false)}/>
            : <button onClick={() => setAdding(true)}
                style={{width:'100%', padding:'12px', display:'flex', alignItems:'center', justifyContent:'center', gap:6, fontSize:13, fontWeight:800, textTransform:'uppercase', letterSpacing:'0.05em', color, borderTop:'1px solid rgba(255,255,255,0.08)'}}>
                <Icon name="plus" size={16} strokeWidth={3}/>Add Exercise
              </button>
          }

          <div style={{padding:'10px 16px', borderTop:'1px solid rgba(255,255,255,0.08)', background:'rgba(0,0,0,0.2)', display:'flex', alignItems:'center', justifyContent:'space-between'}}>
            <span style={{fontSize:11, fontWeight:800, textTransform:'uppercase', letterSpacing:'0.12em', color:'#cbd5e1'}}>Section Done</span>
            <DoneBtn value={log.done} onChange={v => patchSec({done:v})} compact/>
          </div>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────
//  EXERCISE ROW
// ─────────────────────────────────────────────────────
function ExRow({ ex, update, remove, tintColor }) {
  const [editing, setEditing] = useState(false);
  const isDone = ex.done === 'Yes';

  if (editing) {
    return <EditForm ex={ex} tintColor={tintColor}
      onSave={p => { update(p); setEditing(false); }}
      onCancel={() => setEditing(false)}
      onDelete={() => { remove(); setEditing(false); }}/>;
  }

  return (
    <div className={'ex-row' + (isDone ? ' done' : '')}>
      <div className="row" style={{alignItems:'flex-start'}}>
        <div className="grow">
          <div className={'ex-name' + (isDone ? ' done' : '')}>{ex.ex}</div>
          <div className="ex-meta">{ex.sets} × {ex.reps}</div>
        </div>
        <button onClick={() => setEditing(true)} className="edit-btn">
          <Icon name="edit" size={15}/>
        </button>
      </div>
      <div className="row mt-2">
        <input className="input input-mono grow"
          inputMode="decimal" value={ex.weight || ''}
          onChange={e => update({weight:e.target.value})}
          placeholder="Weight / load"/>
        <DoneBtn value={ex.done} onChange={v => update({done:v})}/>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────
//  EDIT FORM
// ─────────────────────────────────────────────────────
function EditForm({ ex, tintColor, onSave, onCancel, onDelete }) {
  const [name, setName] = useState(ex.ex);
  const [sets, setSets] = useState(String(ex.sets));
  const [reps, setReps] = useState(ex.reps);
  const [confirmDel, setConfirmDel] = useState(false);

  return (
    <div style={{padding:'16px', borderBottom:'1px solid rgba(255,255,255,0.06)', background:'rgba(2,6,23,0.5)'}} className="space-y-3">
      <div style={{fontSize:11, fontWeight:800, textTransform:'uppercase', letterSpacing:'0.12em', color:tintColor}}>Edit Exercise</div>
      <input className="input" value={name} onChange={e => setName(e.target.value)} placeholder="Exercise name"/>
      <div className="grid-2">
        <input className="input input-mono" type="number" inputMode="numeric" value={sets} onChange={e => setSets(e.target.value)} placeholder="Sets"/>
        <input className="input input-mono" value={reps} onChange={e => setReps(e.target.value)} placeholder="Reps / duration"/>
      </div>

      {confirmDel ? (
        <div style={{padding:'12px', background:'rgba(190,18,60,0.2)', border:'1px solid #be123c', borderRadius:'12px'}} className="space-y-2">
          <div style={{fontSize:13, color:'#fecdd3', fontWeight:600}}>Delete this exercise?</div>
          <div className="grid-2">
            <button className="btn btn-slate" onClick={() => setConfirmDel(false)}>Cancel</button>
            <button className="btn btn-rose" onClick={onDelete}>Delete</button>
          </div>
        </div>
      ) : (
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8}}>
          <button className="btn" style={{background:'rgba(190,18,60,0.3)', color:'#fecaca'}} onClick={() => setConfirmDel(true)}>
            <Icon name="trash" size={13}/>Delete
          </button>
          <button className="btn btn-slate" onClick={onCancel}>Cancel</button>
          <button className="btn" style={{background:tintColor, color:'#0f172a'}}
            onClick={() => onSave({ex: name.trim()||ex.ex, sets: parseInt(sets)||ex.sets, reps: reps.trim()||ex.reps})}>
            <Icon name="save" size={13} color="#0f172a" strokeWidth={3}/>Save
          </button>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────
//  ADD FORM
// ─────────────────────────────────────────────────────
function AddForm({ tintColor, onSave, onCancel }) {
  const [name, setName] = useState('');
  const [sets, setSets] = useState('3');
  const [reps, setReps] = useState('');
  const valid = name.trim().length > 0;

  return (
    <div style={{padding:'16px', borderTop:'1px solid rgba(255,255,255,0.08)', background:'rgba(2,6,23,0.5)'}} className="space-y-3">
      <div style={{fontSize:11, fontWeight:800, textTransform:'uppercase', letterSpacing:'0.12em', color:tintColor}}>New Exercise</div>
      <input className="input" autoFocus value={name} onChange={e => setName(e.target.value)} placeholder="Exercise name *"/>
      <div className="grid-2">
        <input className="input input-mono" type="number" inputMode="numeric" value={sets} onChange={e => setSets(e.target.value)} placeholder="Sets"/>
        <input className="input input-mono" value={reps} onChange={e => setReps(e.target.value)} placeholder="Reps / duration"/>
      </div>
      <div className="grid-2">
        <button className="btn btn-slate" onClick={onCancel}>Cancel</button>
        <button className="btn" disabled={!valid}
          style={{background:tintColor, color:'#0f172a', opacity: valid ? 1 : 0.3}}
          onClick={() => valid && onSave({ex:name.trim(), sets:parseInt(sets)||3, reps:reps.trim()||'—'})}>
          <Icon name="plus" size={15} color="#0f172a" strokeWidth={3}/>Add
        </button>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────
//  DONE BUTTON
// ─────────────────────────────────────────────────────
function DoneBtn({ value, onChange, compact }) {
  const cycle = {'':'Yes','Yes':'Modified','Modified':'No','No':''};
  const v = value || '';
  const cfg = {
    '':         {cls:'done-mark', label:'Mark',  icon:null},
    'Yes':      {cls:'done-yes',  label:'Done', icon:'check'},
    'Modified': {cls:'done-mod',  label:'Mod',  icon:'edit'},
    'No':       {cls:'done-no',   label:'Skip', icon:'x'},
  }[v];

  return (
    <button onClick={() => onChange(cycle[v])}
      className={cfg.cls}
      style={{padding: compact ? '6px 12px' : '8px 14px', borderRadius:12, fontWeight:800, fontSize: compact ? 10 : 12, textTransform:'uppercase', letterSpacing:'0.06em', minWidth: compact ? 64 : 72, display:'flex', alignItems:'center', justifyContent:'center', gap:5}}>
      {cfg.icon && <Icon name={cfg.icon} size={13} strokeWidth={3} color={cfg.cls === 'done-mod' ? '#0f172a' : '#fff'}/>}
      {cfg.label}
    </button>
  );
}

// ─────────────────────────────────────────────────────
//  STATS VIEW
// ─────────────────────────────────────────────────────
function StatsView({ startDate }) {
  const [logs, setLogs] = useState({});
  const [ready, setReady] = useState(false);

  useEffect(() => {
    (async () => {
      const keys = await storage.list('log:');
      const result = {};
      for (const k of keys) {
        const v = await storage.get(k);
        if (v) { try { result[k.replace('log:','')] = JSON.parse(v); } catch {} }
      }
      setLogs(result);
      setReady(true);
    })();
  }, []);

  const stats = useMemo(() => {
    let daysDone=0, daysSkipped=0, daysMod=0;
    let exDone=0, exTotal=0;
    let energySum=0, energyN=0;
    let pains={S:0,B:0,K:0}, painN=0;
    const perWeek = {};

    Object.entries(logs).forEach(([ds, log]) => {
      const wk = weekNum(parseYMD(ds), startDate);
      if (wk < 1 || wk > 12) return;
      if (!perWeek[wk]) perWeek[wk] = {done:0, skip:0};
      if (log.status === 'Done') { daysDone++; perWeek[wk].done++; }
      if (log.status === 'Skipped') { daysSkipped++; perWeek[wk].skip++; }
      if (log.status === 'Modified') daysMod++;
      if (log.energy != null) { energySum += log.energy; energyN++; }
      if (log.painS != null || log.painB != null || log.painK != null) {
        pains.S += log.painS || 0; pains.B += log.painB || 0; pains.K += log.painK || 0; painN++;
      }
      Object.values(log.sections || {}).forEach(sec => {
        (Array.isArray(sec.exercises) ? sec.exercises : Object.values(sec.exercises || {})).forEach(ex => {
          exTotal++; if (ex.done === 'Yes') exDone++;
        });
      });
    });

    let streak = 0, cur = new Date(new Date().setHours(0,0,0,0));
    for (let i = 0; i < 90; i++) {
      const l = logs[ymd(cur)];
      if (l && (l.status === 'Done' || l.status === 'Modified')) streak++;
      else if (i > 0) break;
      cur = addDays(cur, -1);
    }

    return { daysDone, daysSkipped, daysMod, exDone, exTotal,
      avgEnergy: energyN ? energySum/energyN : null,
      avgS: painN ? pains.S/painN : null,
      avgB: painN ? pains.B/painN : null,
      avgK: painN ? pains.K/painN : null,
      perWeek, streak };
  }, [logs, startDate]);

  if (!ready) return <div className="px-4 pt-5 text-center meta mono">Loading…</div>;

  return (
    <div className="px-4 pt-5 space-y-4">
      <div>
        <div className="h1">Stats</div>
        <div className="meta mono" style={{textTransform:'uppercase', letterSpacing:'0.15em', marginTop:4}}>12-Week Overview</div>
      </div>

      <div className="card card-pad" style={{borderColor:'rgba(245,158,11,0.4)', display:'flex', alignItems:'center', gap:16}}>
        <div style={{width:56, height:56, borderRadius:16, background:'rgba(245,158,11,0.2)', display:'flex', alignItems:'center', justifyContent:'center'}}>
          <Icon name="flame" size={28} color="#fbbf24"/>
        </div>
        <div>
          <div className="mono" style={{fontSize:32, fontWeight:800, color:'#fff', lineHeight:1}}>{stats.streak}</div>
          <div style={{fontSize:13, color:'#cbd5e1', fontWeight:600, marginTop:4}}>Day streak</div>
        </div>
      </div>

      <div className="grid-2">
        {[
          {label:'Days Done', val:stats.daysDone, of:84, color:'#10b981'},
          {label:'Days Skipped', val:stats.daysSkipped, of:84, color:'#ef4444'},
          {label:'Exercises Done', val:stats.exDone, of:stats.exTotal || '—', color:'#fbbf24'},
          {label:'Days Modified', val:stats.daysMod, of:84, color:'#3b82f6'},
        ].map(s => (
          <div key={s.label} className="card card-pad">
            <div className="label">{s.label}</div>
            <div style={{marginTop:6, display:'flex', alignItems:'baseline', gap:4}}>
              <span className="mono" style={{fontSize:28, fontWeight:800, color:s.color}}>{s.val}</span>
              <span className="meta mono">/ {s.of}</span>
            </div>
          </div>
        ))}
      </div>

      <div className="card card-pad">
        <div className="label mb-3">Wellness Averages</div>
        {[
          {label:'Energy', val:stats.avgEnergy, color:'#10b981'},
          {label:'Shoulder Pain', val:stats.avgS, color:'#ef4444'},
          {label:'Back Pain', val:stats.avgB, color:'#ef4444'},
          {label:'Knee Pain', val:stats.avgK, color:'#ef4444'},
        ].map(s => (
          <div key={s.label} className="mb-3">
            <div className="row" style={{justifyContent:'space-between', marginBottom:6}}>
              <span className="secondary" style={{fontSize:13, fontWeight:600}}>{s.label}</span>
              <span className="mono" style={{fontSize:13, fontWeight:700, color:'#fff'}}>{s.val != null ? s.val.toFixed(1) : '—'}<span style={{color:'#64748b'}}> / 10</span></span>
            </div>
            <div className="bar"><div className="bar-fill" style={{width:`${s.val ? Math.min(s.val/10,1)*100 : 0}%`, background:s.color}}/></div>
          </div>
        ))}
      </div>

      <div className="card card-pad">
        <div className="label mb-3">By Week</div>
        {Array.from({length:12}, (_,i)=>i+1).map(wk => {
          const w = stats.perWeek[wk] || {done:0, skip:0};
          const pct = w.done/7;
          return (
            <div key={wk} className="row mb-2">
              <span className="mono" style={{fontSize:12, fontWeight:700, color:'#cbd5e1', width:36}}>Wk {wk}</span>
              <div className="bar grow"><div className="bar-fill" style={{width:`${pct*100}%`, background:'#fbbf24'}}/></div>
              <span className="mono" style={{fontSize:12, fontWeight:700, color:'#cbd5e1', width:32, textAlign:'right'}}>{w.done}/7</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────
//  SETTINGS VIEW
// ─────────────────────────────────────────────────────
function SettingsView({ startDate, setStartDate }) {
  const [confirmReset, setConfirmReset] = useState(false);
  const [msg, setMsg] = useState('');

  const doReset = async () => {
    const keys = await storage.list('log:');
    for (const k of keys) await storage.delete(k);
    setMsg('All data cleared.');
    setConfirmReset(false);
    setTimeout(() => setMsg(''), 3000);
  };

  return (
    <div className="px-4 pt-5 space-y-4">
      <div>
        <div className="h1">Settings</div>
        <div className="meta mono" style={{textTransform:'uppercase', letterSpacing:'0.15em', marginTop:4}}>Configuration</div>
      </div>

      <div className="card card-pad">
        <div className="label mb-3">Plan Start Date</div>
        <input className="input input-mono" type="date" value={startDate}
          onChange={e => setStartDate(e.target.value)} style={{colorScheme:'dark'}}/>
        <p style={{fontSize:12, color:'#94a3b8', marginTop:8}}>Must be a Monday for week numbers to align.</p>
      </div>

      <div className="card card-pad">
        <div className="label mb-3">How It Works</div>
        {[
          "Every change saves automatically (look for the green Saved pill).",
          "Tap the pencil icon on any exercise to edit name, sets, or reps.",
          "Use Add Exercise at the bottom of each section to add custom moves.",
          "Edits are per-day - Monday week 1 won't affect Monday week 2.",
          "Done button cycles: Mark → Done → Mod → Skip → back.",
          "Keep pain under 3/10. Reduce load or swap if pain rises.",
        ].map((t,i) => (
          <div key={i} className="row" style={{alignItems:'flex-start', marginBottom:10, gap:10}}>
            <span style={{color:'#fbbf24', fontWeight:800, flexShrink:0}}>{i+1}.</span>
            <span className="secondary" style={{fontSize:14}}>{t}</span>
          </div>
        ))}
      </div>

      <div className="card card-pad">
        <div className="label mb-3">Weekly Schedule</div>
        {Object.entries(SCHEDULE).map(([day, info]) => (
          <div key={day} className="row mb-2" style={{alignItems:'flex-start', gap:12, borderBottom:'1px solid #334155', paddingBottom:8}}>
            <span className="mono" style={{fontSize:12, fontWeight:800, color:'#fbbf24', width:36}}>{day.slice(0,3).toUpperCase()}</span>
            <span className="secondary" style={{fontSize:14, fontWeight:500}}>{info.focus}</span>
          </div>
        ))}
      </div>

      <div className="card card-pad" style={{borderColor:'rgba(190,18,60,0.4)'}}>
        <div className="label mb-3">Danger Zone</div>
        {!confirmReset ? (
          <button onClick={() => setConfirmReset(true)} className="btn"
            style={{width:'100%', background:'rgba(190,18,60,0.3)', color:'#fecaca', padding:'12px'}}>
            <Icon name="reset" size={15}/>Clear All Log Data
          </button>
        ) : (
          <div className="space-y-3">
            <p style={{fontSize:13, color:'#fecdd3', fontWeight:600}}>Delete all logged data permanently?</p>
            <div className="grid-2">
              <button className="btn btn-slate" onClick={() => setConfirmReset(false)}>Cancel</button>
              <button className="btn btn-rose" onClick={doReset}>Delete All</button>
            </div>
          </div>
        )}
        {msg && <p style={{fontSize:13, color:'#10b981', fontWeight:600, marginTop:8}}>{msg}</p>}
      </div>
    </div>
  );
}

// Mount
const root = ReactDOM.createRoot(document.getElementById('app'));
root.render(<App/>);
</script>
</body>
